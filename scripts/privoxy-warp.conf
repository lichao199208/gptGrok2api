listen-address  0.0.0.0:8118
toggle  1
enable-remote-toggle  0
enable-remote-http-toggle  0
enable-edit-actions  0
enforce-blocks  0
buffer-limit  4096
keep-alive-timeout  300
socket-timeout  300

# Forward all traffic through the WARP SOCKS5 proxy (caomingjun/warp container).
# forward-socks5t does remote DNS so hostnames resolve inside the WARP tunnel.
forward-socks5t   /   warp-proxy:1080   .
